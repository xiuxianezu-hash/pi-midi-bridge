<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI 观察台 · pi-midi-bridge</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1d2126; --sub:#6b7280;
  --out:#1f7a5a; --in:#2b6cb0; --warn:#b45309; --chip:#eef1f5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px}
h1 span{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{background:var(--chip);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--sub);white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip.ok{background:#e7f5ee;color:#1f7a5a}
.chip.off{background:#fdeaea;color:#b0342b}
.chip.warn{background:#fdf3e3;color:var(--warn)}
main{display:grid;grid-template-columns:310px 1fr;gap:12px;padding:12px 16px 24px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card h2{margin:0;padding:9px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
  color:var(--sub);display:flex;justify-content:space-between}
#devs{padding:2px 0;max-height:62vh;overflow:auto}
.grp{padding:6px 12px 2px;font-size:11.5px;color:var(--sub);letter-spacing:.5px}
.grp b{color:var(--text)}
.dev{padding:5px 12px;cursor:pointer;border-left:3px solid transparent}
.dev:hover{background:#f9fafb}
.dev.sel{background:#eef4ff;border-left-color:#2b6cb0}
.dev .n{display:flex;justify-content:space-between;gap:8px}
.dev .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .rt{font-size:11.5px;color:var(--sub);white-space:nowrap}
.dev .meta{font-size:11px;color:var(--sub);display:flex;gap:8px}
.dev .meta .o{color:var(--out)} .dev .meta .i{color:var(--in)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.bar select,.bar input[type=search]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fff}
.bar button{font:inherit;padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
.bar button.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.sep{width:1px;height:18px;background:var(--line);margin:0 2px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:#fbfcfd;text-align:left;font-weight:600;color:var(--sub);
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:3px 8px;border-bottom:1px solid #f1f3f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:#fafbfc}
.d-out{color:var(--out);font-weight:600}
.d-in{color:var(--in);font-weight:600}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#evwrap{max-height:62vh;overflow:auto}
#rtp{padding:8px 12px;font-size:12px;color:var(--sub)}
#rtp .p{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:var(--text)}
#rtp .p small{color:var(--sub)}
footer{padding:8px 16px;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>MIDI 观察台<span id="ver">pi-midi-web</span></h1>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="card">
    <h2><span>设备（按类别）</span><span id="devcount"></span></h2>
    <div id="devs"></div>
    <div style="border-top:1px solid var(--line)"><h2><span>RTP 对端</span></h2><div id="rtp"></div></div>
  </section>

  <section class="card">
    <h2><span>事件流（输入 / 输出）</span><span id="rate"></span></h2>
    <div class="bar">
      <select id="fdev"><option value="">全部设备</option></select>
      <div class="sep"></div>
      <button class="on" data-dir="">全部</button>
      <button data-dir="out">输出 OUT</button>
      <button data-dir="in">输入 IN</button>
      <div class="sep"></div>
      <select id="fch"><option value="">全部通道</option></select>
      <input type="search" id="fq" placeholder="搜索 事件 / 数据 / 原始行" style="width:170px">
      <div class="sep"></div>
      <button id="pause">暂停</button>
      <button id="clear">清屏</button>
    </div>
    <div class="bar" id="kinds"></div>
    <div id="evwrap">
      <table>
        <thead><tr>
          <th style="width:86px">时间</th><th style="width:46px">方向</th>
          <th>设备</th><th style="width:64px">端口</th><th style="width:38px">Ch</th>
          <th style="width:132px">事件</th><th style="width:110px">数据</th><th style="width:56px">音名</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<footer id="foot">纯观测页面：不修改任何蓝牙 / RTP / ALSA 设置，只读取并展示当前协议往来。</footer>

<script>
const KINDS=[["note_on","NoteOn"],["note_off","NoteOff"],["cc","CC"],["pc","PC"],
             ["pb","Pitch"],["sysex","SysEx"],["clock","Clock"],["after","After"],["realtime","Real"],["other","其它"]];
const CATORDER=["蓝牙 Pi-MIDI","内部虚拟口","内部桥（RTP 引擎）","RTP 外部设备","其它"];
const S={since:0, paused:false, dev:"", dir:"", kinds:new Set(), ch:"", q:"",
         rows:[], counters:{}, evTotal:0, tPrev:0, rate:0};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hhmmss(t){const d=new Date(t*1000);return d.toLocaleTimeString("zh-CN",{hour12:false})+"."+String(d.getMilliseconds()).padStart(3,"0");}

function chips(d){
  const br=d.bridge||{}, ble=d.ble||{}, rtp=(d.rtp&&d.rtp.peers)||[];
  const c=[];
  c.push(`<span class="chip ${br.bridge_active?"ok":"off"}">桥 <b>${br.bridge_active?"运行中":"未运行"}</b></span>`);
  c.push(`<span class="chip ${ble.advertising?"ok":"warn"}">广播 <b>${ble.advertising?"Pi-MIDI":"停"}</b></span>`);
  c.push(`<span class="chip ${ble.connected?"ok":""}">蓝牙链路 <b>${ble.connected?esc(ble.peer||"已连接"):"空闲"}</b></span>`);
  c.push(`<span class="chip">BLE 累计 <b>收 ${br.ble_recv||0} / 发 ${br.ble_sent||0}</b>${br.ble_drop?` 丢 ${br.ble_drop}`:""}</span>`);
  c.push(`<span class="chip">RTP 对端 <b>${rtp.length}</b></span>`);
  c.push(`<span class="chip ${d.running?"ok":"off"}">观察器 <b>${d.running?"运行":"停止"}</b></span>`);
  document.getElementById("chips").innerHTML=c.join("");
  document.getElementById("ver").textContent="pi-midi-web "+d.version;
}

function renderDevs(d){
  const groups={};
  (d.devices||[]).forEach(x=>{ (groups[x.cat]=groups[x.cat]||[]).push(x); });
  const ctr=S.counters, out=[];
  CATORDER.concat(Object.keys(groups).filter(k=>!CATORDER.includes(k))).forEach(cat=>{
    const list=groups[cat]; if(!list||!list.length) return;
    out.push(`<div class="grp"><b>${esc(cat)}</b> · ${list.length}</div>`);
    list.forEach(x=>{
      const c=ctr[x.key]||{}; const o=c.out||0, i=c.in||0;
      const sel=(S.dev===x.key)?" sel":"";
      out.push(`<div class="dev${sel}" data-key="${esc(x.key)}">
        <div class="n"><span class="name" title="${esc(x.name)}">${esc(x.name)}</span>
        <span class="rt">${o+i} msgs</span></div>
        <div class="meta"><span class="mono">${esc(x.port)}</span><span class="o">out ${o}</span><span class="i">in ${i}</span>
        <span>&rarr;${(x.to||[]).length} &larr;${(x.from||[]).length}</span></div>
      </div>`);
    });
  });
  document.getElementById("devs").innerHTML=out.join("")||`<div class="grp">暂无端口</div>`;
  document.getElementById("devcount").textContent=(d.devices||[]).length+" 个端口";
  document.querySelectorAll(".dev").forEach(el=>el.onclick=()=>{
    S.dev=(S.dev===el.dataset.key)?"":el.dataset.key;
    document.getElementById("fdev").value=S.dev; renderDevs(d); renderRows();
  });
  const fdev=document.getElementById("fdev");
  const sig=JSON.stringify((d.devices||[]).map(x=>[x.key,x.cat,x.name]));
  if(fdev.dataset.sig!==sig){
    fdev.dataset.sig=sig;
    const g={}; (d.devices||[]).forEach(x=>{(g[x.cat]=g[x.cat]||[]).push(x);});
    let h=`<option value="">全部设备</option>`;
    Object.keys(g).forEach(cat=>{
      h+=`<optgroup label="${esc(cat)}">`;
      g[cat].forEach(x=>{ h+=`<option value="${esc(x.key)}">${esc(x.name)}</option>`; });
      h+=`</optgroup>`;
    });
    fdev.innerHTML=h; fdev.value=S.dev;
  }
}

function renderRtp(d){
  const peers=(d.rtp&&d.rtp.peers)||[];
  document.getElementById("rtp").innerHTML = peers.length
    ? peers.map(p=>`<div class="p"><span>${esc(p.name)}<small> :${esc(p.port)}</small></span>
        <small>收 ${p.recv} / 发 ${p.sent}${p.latency!=null?" · "+Math.round(p.latency)+"ms":""}</small></div>`).join("")
    : `<div style="color:var(--sub)">当前没有 RTP 对端会话</div>`;
}

function matchRow(e){
  if(S.dev && e.key!==S.dev) return false;
  if(S.dir && e.dir!==S.dir) return false;
  if(S.kinds.size && !S.kinds.has(e.kind||"other")) return false;
  if(S.ch!=="" && String(e.chan)!==S.ch) return false;
  if(S.q){
    const t=(e.event+" "+(e.d1==null?"":e.d1)+" "+(e.d2==null?"":e.d2)+" "+(e.note||"")+" "+(e.raw||"")).toLowerCase();
    if(!t.includes(S.q.toLowerCase())) return false;
  }
  return true;
}

function renderRows(){
  const list=S.rows.filter(matchRow).slice(-400).reverse();
  const html=list.map(e=>`<tr title="${esc(e.raw)}">
    <td class="mono">${hhmmss(e.t)}</td>
    <td class="${e.dir==="out"?"d-out":"d-in"}">${e.dir==="out"?"OUT":"IN"}</td>
    <td>${esc(e.name)}</td><td class="mono">${esc(e.port)}</td>
    <td>${e.chan==null?"":e.chan}</td>
    <td>${esc(e.event)}</td>
    <td class="mono">${e.d1==null?"":e.d1}${e.d2==null?"":" , "+e.d2}</td>
    <td class="mono">${esc(e.note||"")}</td></tr>`).join("");
  document.getElementById("rows").innerHTML=html ||
    `<tr><td colspan="8" style="padding:18px;color:var(--sub)">暂无匹配事件（链路安静时这里是空的，属正常）</td></tr>`;
}

function calcRate(d){
  const ctr=d.counters||{};
  let total=0; for(const k in ctr) total+=(ctr[k].out||0)+(ctr[k].in||0);
  const now=Date.now()/1000;
  if(S.tPrev){ S.rate=Math.max(0,(total-S.evTotal)/Math.max(0.2,now-S.tPrev)); }
  S.evTotal=total; S.tPrev=now;
  document.getElementById("rate").textContent=`${S.rate.toFixed(1)} msg/s · 累计 ${total}`;
}

async function poll(){
  try{
    const r=await fetch(`/api/observe?since=${S.since}`,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    S.counters=d.counters||{};
    chips(d); renderDevs(d); renderRtp(d); calcRate(d);
    if(!S.paused){
      (d.events||[]).forEach(e=>S.rows.push(e));
      if(S.rows.length>1200) S.rows.splice(0,S.rows.length-1200);
      renderRows();
    }
    S.since=Math.max(S.since,d.last||0);
  }catch(err){
    document.getElementById("foot").textContent="读取失败："+err.message+"（观察器可能正在重启订阅）";
  }
}

document.getElementById("fdev").onchange=e=>{S.dev=e.target.value; renderRows();};
document.getElementById("fch").onchange=e=>{S.ch=e.target.value; renderRows();};
document.getElementById("fq").oninput=e=>{S.q=e.target.value; renderRows();};
document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{
  S.dir=b.dataset.dir;
  document.querySelectorAll("[data-dir]").forEach(x=>x.classList.toggle("on",x===b));
  renderRows();
});
document.getElementById("kinds").innerHTML=KINDS.map(([k,label])=>
  `<button data-kind="${k}">${label}</button>`).join("");
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.kind;
  S.kinds.has(k)?S.kinds.delete(k):S.kinds.add(k);
  b.classList.toggle("on",S.kinds.has(k));
  renderRows();
});
document.getElementById("pause").onclick=e=>{
  S.paused=!S.paused;
  e.target.classList.toggle("on",S.paused);
  e.target.textContent=S.paused?"继续":"暂停";
};
document.getElementById("clear").onclick=()=>{S.rows=[];renderRows();};
(function(){
  let h=`<option value="">全部通道</option>`;
  for(let i=0;i<16;i++) h+=`<option value="${i}">Ch ${i+1}</option>`;
  document.getElementById("fch").innerHTML=h;
})();

poll(); setInterval(poll,900);
</script>
</body>
</html>
