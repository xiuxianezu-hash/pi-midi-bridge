<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI 观察台 · pi-midi-bridge</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e1e4e8; --text:#1c2024; --sub:#6b7280;
  --out:#1f7a5a; --in:#2b6cb0; --disc:#b0342b; --chip:#eef1f5; --hex:#3b2f6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);
  padding:9px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{margin:0;font-size:14.5px;font-weight:600}
h1 span{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{background:var(--chip);border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip.ok{background:#e7f5ee;color:#1f7a5a}
.chip.off{background:#fdeaea;color:var(--disc)}
.chip.warn{background:#fdf3e3;color:#b45309}

.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;
  background:#fff;border-bottom:1px solid var(--line)}
.tools select,.tools input[type=search]{font:inherit;padding:3px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
.tools button{font:inherit;padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
.tools button.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
label.mini{color:var(--sub);font-size:12px}

/* 设备横向条 */
#devstrip{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
.dgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dgrp>span.lbl{color:var(--sub);font-size:11.5px}
.dchip{border:1px solid var(--line);border-radius:14px;padding:2px 9px;font-size:11.5px;cursor:pointer;background:#fff}
.dchip:hover{background:#f7f9fb}
.dchip.sel{background:#eef4ff;border-color:#2b6cb0;color:#1d4ed8}
.dchip small{color:var(--sub);margin-left:4px}
.dchip b{font-weight:600}

/* 88 键钢琴 */
#pianowrap{margin:10px 14px 0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#pianowrap h2{margin:0;padding:7px 11px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
  background:#fbfcfd;display:flex;justify-content:space-between;align-items:center;gap:10px}
#pianowrap h2 .lg{font-weight:400;font-size:11.5px;color:var(--sub);display:flex;gap:10px;align-items:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.lg .i-in{background:var(--in)} .lg .i-out{background:var(--out)} .lg .i-both{background:linear-gradient(90deg,var(--in),var(--out))}
#pianoscroll{overflow-x:auto;padding:9px 11px 11px}
#piano{position:relative;height:96px;min-width:780px;user-select:none}
#piano .wk{position:absolute;top:0;bottom:0;background:#fff;border:1px solid #d7dbe0;border-radius:0 0 4px 4px;
  box-shadow:inset 0 -3px 0 #eceff3}
#piano .wk.on-in{background:linear-gradient(180deg,#dbeafe,#2b6cb0)}
#piano .wk.on-out{background:linear-gradient(180deg,#d6f0e4,#1f7a5a)}
#piano .wk.on-in.on-out{background:linear-gradient(180deg,#e6e0f7,#6b46c1)}
#piano .bk{position:absolute;top:0;height:58%;background:#3a4149;border:1px solid #22282e;border-radius:0 0 3px 3px;
  z-index:2;box-shadow:inset 0 -2px 0 #232a30}
#piano .bk.on-in{background:linear-gradient(180deg,#2b6cb0,#1e4b7a)}
#piano .bk.on-out{background:linear-gradient(180deg,#1f7a5a,#14553d)}
#piano .bk.on-in.on-out{background:linear-gradient(180deg,#6b46c1,#43308a)}
#piano .lab{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9.5px;color:#8b939b;
  font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none}
#pianostats{font-size:11.5px;color:var(--sub);min-height:16px}

.panes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 0}
@media(max-width:1000px){.panes{grid-template-columns:1fr}}
.pane{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.pane h2{margin:0;padding:7px 11px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;background:#fbfcfd}
.pane h2 .t{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%}
.pane.in h2 .dot{background:var(--in)} .pane.out h2 .dot{background:var(--out)}
.pane h2 .n{color:var(--sub);font-weight:400;font-size:11.5px}
.list{overflow:auto;height:40vh}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:#fff;text-align:left;font-weight:600;color:var(--sub);
  padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
tbody td{padding:2px 8px;border-bottom:1px solid #f3f5f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:#fafbfc}
.tm{color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.hex{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--hex);font-weight:600;letter-spacing:.4px}
.dev{color:var(--sub);font-size:11.5px}
.empty{padding:14px;color:var(--sub)}

#noticewrap{margin:10px 14px 20px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#noticewrap h2{margin:0;padding:7px 11px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
  color:var(--sub);background:#fbfcfd;display:flex;justify-content:space-between}
#notices{max-height:22vh;overflow:auto;font-size:12px}
.nrow{display:flex;gap:9px;padding:3px 11px;border-bottom:1px solid #f6f7f9}
.nrow .tag{width:52px;flex:none;font-weight:600;font-size:11.5px}
.nrow.conn .tag{color:#1f7a5a} .nrow.disc .tag{color:var(--disc)} .nrow.info .tag{color:var(--sub)}
.nrow .txt{flex:1}
footer{padding:0 14px 20px;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>MIDI 观察台<span id="ver">pi-midi-web</span></h1>
  <div class="chips" id="chips"></div>
</header>

<div class="tools">
  <label class="mini">通道</label>
  <select id="fch"></select>
  <label class="mini">类型</label>
  <div id="kinds" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  <div class="sep"></div>
  <input type="search" id="fq" placeholder="搜索 十六进制 / 事件 / 设备" style="width:190px">
  <div class="sep"></div>
  <button id="pause">暂停</button>
  <button id="clear">清屏</button>
</div>

<div id="devstrip"></div>

<div id="pianowrap">
  <h2>
    <span>88 键钢琴 · 实时弹奏（A0–C8）</span>
    <span class="lg">
      <span><i class="i-in"></i>输入/收到</span>
      <span><i class="i-out"></i>输出/发出</span>
      <span><i class="i-both"></i>同时</span>
      <span id="pianostats"></span>
    </span>
  </h2>
  <div id="pianoscroll"><div id="piano"></div></div>
</div>

<div class="panes">
  <section class="pane in">
    <h2><span class="t"><span class="dot"></span>输入 INPUT（收到）</span><span class="n" id="cnt-in"></span></h2>
    <div class="list" id="list-in"><table><thead><tr>
      <th style="width:78px">时间</th><th style="width:130px">十六进制</th>
      <th>释义</th><th style="width:150px">设备 / 端口</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
  <section class="pane out">
    <h2><span class="t"><span class="dot"></span>输出 OUTPUT（发出）</span><span class="n" id="cnt-out"></span></h2>
    <div class="list" id="list-out"><table><thead><tr>
      <th style="width:78px">时间</th><th style="width:130px">十六进制</th>
      <th>释义</th><th style="width:150px">设备 / 端口</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
</div>

<div id="noticewrap">
  <h2><span>系统通知（连接 / 断开 / 端口变化）</span><span id="cnt-note" style="font-weight:400;font-size:11.5px"></span></h2>
  <div id="notices"></div>
</div>

<footer id="foot">纯观测页面：不修改任何蓝牙 / RTP / ALSA 设置，只读取并展示当前协议往来。</footer>

<script>
const KINDS=[["note_on","音符开"],["note_off","音符关"],["cc","CC"],["pc","音色"],
             ["pb","弯音"],["sysex","SysEx"],["clock","时钟"],["after","触后"],["realtime","实时"],["other","其它"]];
const CATORDER=["内部虚拟口","内部桥（RTP 引擎）","RTP 外部设备","其它"];
const S={since:0, noteSince:0, paused:false, dev:"", kinds:new Set(), ch:"", q:"",
         inRows:[], outRows:[], notices:[], counters:{}, evTotal:0, tPrev:0,
         nkSince:0, nkAt:0};
const MAXROWS=600;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function tm(t){const d=new Date(t*1000);return d.toLocaleTimeString("zh-CN",{hour12:false})+"."+String(d.getMilliseconds()).padStart(3,"0");}

/* ---- 88 键钢琴（布尔状态机 + 延音踏板）---- */
const P_FIRST=21, P_LAST=108, BLACK_PC=[1,3,6,8,10], PCNM=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const KEYS=new Map(), ACTIVE=new Map(), WATCH=new Map(), SUSTAINED=new Set();
const WHITE_W=100/52;
let sustainOn=false, statPending=false, SUS_T=null;

function buildPiano(){
  const whites=[], blacks=[]; let wi=0;
  for(let m=P_FIRST;m<=P_LAST;m++){
    const pc=m%12, black=BLACK_PC.includes(pc);
    if(!black){ whites.push({m,wi,pc}); wi++; } else blacks.push({m,wi,pc});
  }
  const wh=[], bh=[];
  whites.forEach(k=>{
    const oct=Math.floor(k.m/12)-1;
    wh.push(`<div class="wk" data-m="${k.m}" style="left:${(k.wi*WHITE_W).toFixed(3)}%;width:${WHITE_W.toFixed(3)}%">${k.pc===0?`<span class="lab">C${oct}</span>`:""}</div>`);
  });
  blacks.forEach(k=>{
    const bw=WHITE_W*0.62;
    bh.push(`<div class="bk" data-m="${k.m}" style="left:${(k.wi*WHITE_W-bw/2).toFixed(3)}%;width:${bw.toFixed(3)}%"></div>`);
  });
  const el=document.getElementById("piano");
  el.innerHTML=wh.join("")+bh.join("");
  document.querySelectorAll("#piano [data-m]").forEach(n=>KEYS.set(+n.dataset.m,n));
}

function midiName(m){return PCNM[m%12]+(Math.floor(m/12)-1);}

function stateAll(){ // 标题只做节流刷新，真正的键位绘制由 paint() 逐键完成
  if(statPending) return; statPending=true;
  setTimeout(()=>{
    statPending=false;
    const n2=[]; ACTIVE.forEach((v,k)=>{ if(v.in||v.out) n2.push(k); });
    const s=document.getElementById("pianostats");
    if(s) s.textContent=n2.length?`按下的键（${n2.length}）：`+n2.map(midiName).join(" "):"";
  },60);
}

function paint(m){
  const el=KEYS.get(m); if(!el) return;
  const a=ACTIVE.get(m)||{};
  el.classList.toggle("on-in",!!a.in);
  el.classList.toggle("on-out",!!a.out);
}

function keyOn(m,dir){
  if(!KEYS.has(m)) return;
  let a=ACTIVE.get(m); if(!a){a={in:false,out:false};ACTIVE.set(m,a);}
  a[dir]=true; SUSTAINED.delete(m); paint(m); stateAll();
  clearTimeout(WATCH.get(m));
  WATCH.set(m,setTimeout(()=>{  // 5s 兜底释键：防丢 off 事件卡键（踏板踩住时不掐）
    if(sustainOn){ WATCH.delete(m); return; }
    const b=ACTIVE.get(m); if(!b) return;
    b[dir]=false; if(!b.in&&!b.out) ACTIVE.delete(m);
    paint(m); stateAll();
  },5000));
}

function keyOff(m,dir){
  const a=ACTIVE.get(m); if(!a) return;
  if(sustainOn){                                    // 踏板踩着：先挂住，交给 releasePedal
    SUSTAINED.add(m); clearTimeout(WATCH.get(m)); WATCH.delete(m); return;
  }
  a[dir]=false; if(!a.in&&!a.out) ACTIVE.delete(m);
  paint(m); stateAll();
}

function releasePedal(){
  SUSTAINED.forEach(m=>{
    const a=ACTIVE.get(m); if(!a){SUSTAINED.delete(m);return;}
    a.in=false; a.out=false; ACTIVE.delete(m); paint(m);
  });
  SUSTAINED.clear(); stateAll();
}

function pianoFeed(events){
  let touched=false;
  events.forEach(e=>{
    if(S.dev && e.key!==S.dev) return;
    if(e.kind==="cc"){
      if(Number(e.d1)===64){
        const v=Number(e.d2)||0, was=sustainOn;
        sustainOn=v>=64;
        clearTimeout(SUS_T);
        if(sustainOn) SUS_T=setTimeout(()=>{ if(sustainOn){sustainOn=false;releasePedal();} },12000); // 12s 无更新自动松踏板
        if(was&&!sustainOn) releasePedal();
      }
      return;
    }
    if(e.kind!=="note_on" && e.kind!=="note_off") return;
    const m=Number(e.d1); if(!Number.isFinite(m)||!KEYS.has(m)) return;
    const dir=e.dir==="in"?"in":"out";
    const on=(e.kind==="note_on" && Number(e.d2||0)>0);
    on?keyOn(m,dir):keyOff(m,dir);
    touched=true;
  });
  if(touched) stateAll();
}
buildPiano();

function chips(d){
  const br=d.bridge||{}, ble=d.ble||{}, rtp=(d.rtp&&d.rtp.peers)||[];
  const c=[];
  c.push(`<span class="chip ${br.bridge_active?"ok":"off"}">桥 <b>${br.bridge_active?"运行中":"未运行"}</b></span>`);
  c.push(`<span class="chip ${ble.advertising?"ok":"warn"}">广播 <b>${ble.advertising?"Pi-MIDI":"停"}</b></span>`);
  c.push(`<span class="chip ${ble.connected?"ok":""}">蓝牙链路 <b>${ble.connected?esc(ble.peer||"已连接"):"空闲"}</b></span>`);
  c.push(`<span class="chip">BLE 累计 <b>收 ${br.ble_recv||0} / 发 ${br.ble_sent||0}</b>${br.ble_drop?` 丢 ${br.ble_drop}`:""}</span>`);
  c.push(`<span class="chip">RTP 对端 <b>${rtp.length}</b></span>`);
  c.push(`<span class="chip ${d.running?"ok":"off"}">观察器 <b>${d.running?"运行":"停止"}</b></span>`);
  document.getElementById("chips").innerHTML=c.join("");
  document.getElementById("ver").textContent="pi-midi-web "+d.version;
}

function renderDevStrip(d){
  const g={}; (d.devices||[]).forEach(x=>{(g[x.cat]=g[x.cat]||[]).push(x);});
  const ctr=S.counters, out=[];
  CATORDER.concat(Object.keys(g).filter(k=>!CATORDER.includes(k))).forEach(cat=>{
    if(!g[cat]) return;
    out.push(`<div class="dgrp"><span class="lbl">${esc(cat)}</span>`);
    g[cat].forEach(x=>{
      const c=ctr[x.key]||{}; const o=c.out||0, i=c.in||0;
      out.push(`<span class="dchip${S.dev===x.key?" sel":""}" data-key="${esc(x.key)}">
        ${esc(x.name)} <small>${esc(x.port)}</small>
        <b style="color:var(--in)">${i}</b>/<b style="color:var(--out)">${o}</b></span>`);
    });
    out.push(`</span></div>`);
  });
  document.getElementById("devstrip").innerHTML=out.join("")||`<span class="lbl">暂无端口</span>`;
  document.querySelectorAll(".dchip").forEach(el=>el.onclick=()=>{
    S.dev=(S.dev===el.dataset.key)?"":el.dataset.key;
    renderDevStrip(d); renderAll();
  });
}

function match(e){
  if(S.dev && e.key!==S.dev) return false;
  if(S.kinds.size && !S.kinds.has(e.kind||"other")) return false;
  if(S.ch!=="" && String(e.chan)!==S.ch) return false;
  if(S.q){
    const t=(e.hex+" "+(e.desc||"")+" "+(e.name||"")+" "+(e.port||"")+" "+(e.event||"")).toLowerCase();
    if(!t.includes(S.q.toLowerCase())) return false;
  }
  return true;
}

function tableHTML(rows, dir){
  const list=rows.filter(match).slice(-260).reverse();
  if(!list.length) return `<tr><td colspan="4" class="empty">暂无${dir==="in"?"输入":"输出"}数据</td></tr>`;
  return list.map(e=>`<tr title="${esc(e.raw)}">
    <td class="tm">${tm(e.t)}</td>
    <td class="hex">${esc(e.hex||"—")}</td>
    <td>${esc(e.desc||e.event)}</td>
    <td class="dev">${esc(e.name)} <span class="tm">${esc(e.port)}</span></td></tr>`).join("");
}

function renderAll(){
  document.querySelector("#list-in tbody").innerHTML=tableHTML(S.inRows,"in");
  document.querySelector("#list-out tbody").innerHTML=tableHTML(S.outRows,"out");
  document.getElementById("cnt-in").textContent=`${S.inRows.length} 条`;
  document.getElementById("cnt-out").textContent=`${S.outRows.length} 条`;
  const sorted=S.notices.slice(-160).reverse();
  document.getElementById("notices").innerHTML=sorted.map(n=>`<div class="nrow ${n.kind}">
    <span class="tag">${n.kind==="conn"?"连接":n.kind==="disc"?"断开":"提示"}</span>
    <span class="tm">${tm(n.t)}</span><span class="txt">${esc(n.text)}</span></div>`).join("")
    || `<div class="nrow info"><span class="tag">提示</span><span class="txt" style="color:var(--sub)">暂无系统通知（链路稳定时不会刷屏）</span></div>`;
  document.getElementById("cnt-note").textContent=`${S.notices.length} 条`;
}

function calcRate(d){
  const ctr=d.counters||{}; let total=0;
  for(const k in ctr) total+=(ctr[k].out||0)+(ctr[k].in||0);
  const now=Date.now()/1000;
  if(S.tPrev){
    const rate=(total-S.evTotal)/Math.max(0.2,now-S.tPrev);
    document.getElementById("foot").textContent=
      `当前 ${rate.toFixed(1)} msg/s · 累计 ${total} 条 · 纯观测页面，不修改任何蓝牙 / RTP / ALSA 设置`;
  }
  S.evTotal=total; S.tPrev=now;
}

async function poll(){
  try{
    const r=await fetch(`/api/observe?since=${S.since}&note_since=${S.noteSince}`,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    S.counters=d.counters||{};
    chips(d); renderDevStrip(d); calcRate(d);
    if(Date.now()-S.nkAt>2000) pianoFeed(d.events||[]);   // 高速通道断了才用主轮询兜底
    if(!S.paused){
      (d.events||[]).forEach(e=>{
        const arr=e.dir==="in"?S.inRows:S.outRows;
        arr.push(e); if(arr.length>MAXROWS) arr.splice(0,arr.length-MAXROWS);
      });
      (d.notices||[]).forEach(n=>S.notices.push(n));
      if(S.notices.length>400) S.notices.splice(0,S.notices.length-400);
      S.noteSince=Math.max(S.noteSince,d.note_last||0);
      renderAll();
    }
    S.since=Math.max(S.since,d.last||0);
  }catch(err){
    document.getElementById("foot").textContent="读取失败："+err.message+"（观察器可能正在重启订阅）";
  }
}

document.getElementById("fch").onchange=e=>{S.ch=e.target.value; renderAll();};
document.getElementById("fq").oninput=e=>{S.q=e.target.value; renderAll();};
document.getElementById("kinds").innerHTML=KINDS.map(([k,l])=>
  `<button data-kind="${k}" style="font-size:11.5px;padding:2px 7px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer">${l}</button>`).join("");
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.kind;
  S.kinds.has(k)?S.kinds.delete(k):S.kinds.add(k);
  b.style.background=S.kinds.has(k)?"#2b6cb0":"#fff";
  b.style.color=S.kinds.has(k)?"#fff":"inherit";
  b.style.borderColor=S.kinds.has(k)?"#2b6cb0":"var(--line)";
  renderAll();
});
document.getElementById("pause").onclick=e=>{
  S.paused=!S.paused;
  e.target.style.background=S.paused?"#2b6cb0":"#fff";
  e.target.style.color=S.paused?"#fff":"inherit";
  e.target.textContent=S.paused?"继续":"暂停";
};
document.getElementById("clear").onclick=()=>{
  S.inRows=[];S.outRows=[];S.notices=[];renderAll();
  WATCH.forEach(t=>clearTimeout(t)); WATCH.clear();
  ACTIVE.clear(); SUSTAINED.clear(); sustainOn=false;
  KEYS.forEach((el,m)=>paint(m));
  document.getElementById("pianostats").textContent="";
};
(function(){
  let h=`<option value="">全部通道</option>`;
  for(let i=0;i<16;i++) h+=`<option value="${i}">Ch ${i+1}</option>`;
  document.getElementById("fch").innerHTML=h;
})();

async function notesPoll(){                              // 钢琴专用：只拉轻量音符，前端 JS 渲染
  try{
    const r=await fetch(`/api/notes?since=${S.nkSince}`,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    S.nkAt=Date.now();
    pianoFeed(d.events||[]);
    S.nkSince=Math.max(S.nkSince,d.last||0);
  }catch(_){ /* 失败就退回主轮询的 events */ }
}

poll(); notesPoll();
setInterval(poll,700);
setInterval(notesPoll,120);
</script>
