<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi-midi 路由管理</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#272c36;--fg:#e6e9ef;--dim:#8b94a3;--acc:#41c9a0;--bad:#e05c5c;--blue:#5b8def}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:600}
.tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:#1b1f28;color:var(--dim);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer}
.tab.on{color:#08120e;background:var(--acc);border-color:var(--acc);font-weight:600}
main{padding:16px;display:grid;gap:16px}
.top{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim)}
button{background:#232833;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#08120e;font-weight:600}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
select,input{background:#1d222b;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;width:100%}
.form{display:grid;grid-template-columns:1fr 92px auto;gap:8px;margin-top:10px}
.pill{padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.ok{color:var(--acc);border-color:var(--acc)}.bad{color:var(--bad);border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);color:var(--dim)}
th{color:#c9d0dc;font-weight:500}
.panel{display:none}.panel.on{display:block}
#graph{width:100%;height:520px;overflow:auto;background:#12151b;border:1px solid var(--line);border-radius:10px}
svg{display:block}
.node rect{fill:#1e2431;stroke:#39425a;rx:6}
.node text{fill:#dfe4ee;font-size:11px}
.node.cc rect{fill:#1b2735}
.node.rtp rect{fill:#2a2231}
.node.sel rect{stroke:var(--acc);stroke-width:2}
.node:hover rect{stroke:var(--blue)}
.legend{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#232833;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
#mon{height:300px;overflow:auto;background:#12151b;border:1px solid var(--line);border-radius:10px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#c9d0dc}
#mon div{padding:1px 0;border-bottom:1px dashed #1e2431}
.hint{font-size:11px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>pi-midi 路由管理</h1><span class="tag" id="ver">…</span><span class="tag" id="tick">-</span>
  <div class="tabs">
    <button class="tab on" data-tab="g">连线图</button>
    <button class="tab" data-tab="m">路由表</button>
    <button class="tab" data-tab="p">预设</button>
    <button class="tab" data-tab="v">监视器</button>
  </div>
</header>
<main>
  <div class="top">
    <div class="card">
      <h2>蓝牙（BLE-MIDI 外设）</h2>
      <div class="row"><span>广播</span><span id="ble-adv" class="pill">…</span></div>
      <div class="row"><span>链路</span><span id="ble-link" class="pill">…</span></div>
      <div class="row"><span>对端地址</span><span id="ble-peer" class="mono">-</span></div>
      <div class="legend">BLE 外设同一时刻只支持 1 条链路。</div>
    </div>
    <div class="card">
      <h2>RTP-MIDI 设备</h2>
      <div id="rtp-list"><div class="row"><span class="mono">加载中…</span></div></div>
      <div class="form">
        <input id="rtp-host" placeholder="主机 IP 或名称，如 192.168.31.142">
        <input id="rtp-port" value="5004">
        <button class="pri" id="rtp-add">连接</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="panel on" id="p-g">
      <h2>连线图 — 点两个端口即连接，点连线即断开</h2>
      <div id="graph"></div>
      <div class="legend" id="ghint">已选源：无</div>
    </div>

    <div class="panel" id="p-m">
      <h2>路由表（精确选择端口）</h2>
      <div class="form">
        <select id="alsrc"></select><select id="aldst"></select>
        <button class="pri" id="allink">连接</button>
      </div>
      <div class="form" style="grid-template-columns:1fr 1fr auto">
        <button id="allink-both">双向连接</button><button id="alunlink">断开</button><button id="alrefresh">刷新</button>
      </div>
      <table style="margin-top:12px"><thead><tr><th>源</th><th>→ 目的</th></tr></thead><tbody id="al-links"></tbody></table>
    </div>

    <div class="panel" id="p-p">
      <h2>路由预设 — 一键保存 / 回放当前连线</h2>
      <div class="form">
        <input id="preset-name" placeholder="预设名，如 蓝牙→Mac+Windows">
        <button class="pri" id="preset-save" style="grid-column:span 2">保存当前连线</button>
      </div>
      <table style="margin-top:12px"><thead><tr><th>预设</th><th>连线数</th><th>保存时间</th><th></th></tr></thead><tbody id="preset-rows"></tbody></table>
      <div class="hint">「应用」会先清掉现有的非 System 连接，再按预设重建，避免叠加出环。</div>
    </div>

    <div class="panel" id="p-v">
      <h2>MIDI 监视器 — 实时看某端口进出的消息</h2>
      <div class="form" style="grid-template-columns:1fr auto auto">
        <select id="mon-port"></select>
        <button class="pri" id="mon-start">开始</button>
        <button id="mon-stop">停止</button>
      </div>
      <div id="mon"></div>
      <div class="hint">监视器会常驻一个 aseqdump 进程；不看了点「停止」释放。</div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
let TOKEN = localStorage.getItem('pimidi.token') || '';
let STATE = null, SEL = null, MSINCE = 0, MTIMER = null, CURTAB = 'g';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900)}
async function api(path,opt){opt=opt||{};if(TOKEN)opt.headers=Object.assign({'X-Token':TOKEN},opt.headers||{});
  const r=await fetch(path,opt);if(r.status===401){TOKEN=prompt('需要访问 token：')||'';localStorage.setItem('pimidi.token',TOKEN);return api(path,opt)}
  return r.json()}
const post=(p,o)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
const wrap=n=>n.replace(/\s+/g,' ').trim();
const portLabel=(c,p)=>c.id+':'+p.id+'  '+wrap(p.name);

/* ---------- 状态刷新 ---------- */
async function refresh(){
  try{ STATE = await api('/api/state') }catch(e){ document.getElementById('tick').textContent='连接失败'; return }
  document.getElementById('ver').textContent='v'+STATE.version;
  document.getElementById('tick').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  renderBle(); renderRtp(); fillSelects(); renderTable(); renderPresets(); renderGraph();
}

function renderBle(){
  const b=STATE.ble;
  const adv=document.getElementById('ble-adv'), lk=document.getElementById('ble-link');
  adv.textContent=b.advertising?'广播中':'未广播'; adv.className='pill '+(b.advertising?'ok':'bad');
  lk.textContent=b.connected?'已连接':'等待连接'; lk.className='pill '+(b.connected?'ok':'');
  document.getElementById('ble-peer').textContent=b.peer||'-';
}

function renderRtp(){
  const rtp=STATE.rtp||{};
  const peers=(rtp.router||[]).filter(p=>p.peer);
  const remotes=(rtp.mdns&&rtp.mdns.remote_announcements)||[];
  const uniq=[...new Map(remotes.map(r=>[r.name,r])).values()];
  let html='';
  peers.forEach(p=>{
    const lat=(p.peer.latency_ms&&p.peer.latency_ms.last)||0;
    html+='<div class="row"><span>'+p.name+' <span class="mono">#'+p.id+' · '+lat+' ms</span></span>'+
          '<button class="danger" onclick="rtpRemove('+p.id+')">断开</button></div>';
  });
  if(!peers.length) html+='<div class="row"><span class="mono">暂无已连接的对端</span></div>';
  uniq.forEach(r=>{
    if(peers.some(p=>p.name===r.name))return;
    html+='<div class="row"><span>'+r.name+' <span class="mono">'+r.hostname+':'+r.port+'</span></span>'+
          '<button onclick="rtpConnect(\''+r.hostname+'\','+r.port+',\''+r.name.replace(/'/g,"\\'")+'\')">连接</button></div>';
  });
  document.getElementById('rtp-list').innerHTML=html;
}

function allPorts(){
  const out=[]; STATE.alsa.forEach(c=>c.ports.forEach(p=>out.push({c,p})));
  return out;
}
function fillSelects(){
  const opts=allPorts().map(o=>'<option value="'+o.c.id+':'+o.p.id+'">'+portLabel(o.c,o.p)+'</option>').join('');
  ['alsrc','aldst','mon-port'].forEach(id=>{
    const el=document.getElementById(id), v=el.value; el.innerHTML=opts; if(v)el.value=v;
  });
}

function renderTable(){
  let rows='';
  (STATE.links||[]).forEach(([s,d],i)=>{
    rows+='<tr><td>'+s+'</td><td>'+d+'</td><td style="text-align:right">'+
          '<button class="danger" onclick="unlinkPair(\''+s+'\',\''+d+'\')">断开</button></td></tr>';
  });
  document.getElementById('al-links').innerHTML=rows||'<tr><td class="mono">还没有任何路由</td><td></td><td></td></tr>';
}

function renderPresets(){
  const ps=STATE.presets||{}, keys=Object.keys(ps);
  let rows='';
  keys.forEach(k=>{
    rows+='<tr><td>'+k+'</td><td>'+(ps[k].pairs||[]).length+'</td><td class="mono">'+(ps[k].saved||'')+'</td>'+
      '<td style="text-align:right"><button onclick="applyPreset(\''+k.replace(/'/g,"\\'")+'\')">应用</button> '+
      '<button class="danger" onclick="delPreset(\''+k.replace(/'/g,"\\'")+'\')">删除</button></td></tr>';
  });
  document.getElementById('preset-rows').innerHTML=rows||'<tr><td class="mono">还没有预设</td><td></td><td></td><td></td></tr>';
}

/* ---------- 连线图 ---------- */
function renderGraph(){
  const box=document.getElementById('graph');
  const clients=STATE.alsa.filter(c=>c.ports.length && c.id!==0);
  const pos={}; const COLW=196, ROWH=46, PAD=18;
  let maxRows=1;
  clients.forEach((c,ci)=>{
    maxRows=Math.max(maxRows,c.ports.length);
    c.ports.forEach((p,pi)=>{ pos[c.id+':'+p.id]={x:PAD+ci*COLW, y:PAD+pi*ROWH, w:168, h:32, c, p}; });
  });
  const W=PAD*2+clients.length*COLW, H=PAD*2+maxRows*ROWH+10;
  let svg='<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">';
  // 连线
  (STATE.links||[]).forEach(([s,d])=>{
    const a=pos[s], b=pos[d]; if(!a||!b)return;
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
    const mx=(x1+x2)/2;
    svg+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" stroke="#41c9a0" stroke-width="1.6" fill="none" opacity="0.75" style="cursor:pointer" onclick="unlinkPair(\''+s+'\',\''+d+'\')"/>';
    svg+='<circle cx="'+x2+'" cy="'+y2+'" r="3" fill="#41c9a0"/>';
  });
  // 节点
  clients.forEach(c=>{
    c.ports.forEach(p=>{
      const q=pos[c.id+':'+p.id], key=c.id+':'+p.id;
      let cls='node'+(c.id>=128?' rtp':'')+(SEL===key?' sel':'');
      svg+='<g class="'+cls+'" style="cursor:pointer" onclick="pickNode(\''+key+'\')">'+
           '<rect x="'+q.x+'" y="'+q.y+'" width="'+q.w+'" height="'+q.h+'" rx="6"/>'+
           '<text x="'+(q.x+9)+'" y="'+(q.y+20)+'">'+escapeHtml(wrap(p.name).slice(0,22))+'</text>'+
           '<text x="'+(q.x+q.w-8)+'" y="'+(q.y+20)+'" text-anchor="end" fill="#6f7a8c">'+c.id+':'+p.id+'</text>'+
           '</g>';
    });
  });
  svg+='</svg>';
  box.innerHTML=svg;
  document.getElementById('ghint').textContent = SEL? ('已选源 '+SEL+' — 再点一个端口作为目的') : '已选源：无（点端口选择源）';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function pickNode(key){
  if(!SEL){ SEL=key; renderGraph(); return }
  if(SEL===key){ SEL=null; renderGraph(); return }
  const r=await post('/api/alsa',{op:'link',src:SEL,dst:key});
  toast(r.ok?('已连接 '+SEL+' → '+key):('失败：'+(r.out||''))); SEL=null; refresh();
}
async function unlinkPair(s,d){
  if(!confirm('断开 '+s+' → '+d+' ?'))return;
  await post('/api/alsa',{op:'unlink',src:s,dst:d}); toast('已断开 '+s+' → '+d); refresh();
}
async function rtpConnect(hostname,port,name){
  const r=await post('/api/rtp',{op:'connect',hostname,port,name});
  toast(r.ok?'已发起连接':'失败：'+(r.error||'')); refresh();
}
async function rtpRemove(id){
  const r=await post('/api/rtp',{op:'remove',id}); toast(r.ok?'已移除':'失败：'+(r.error||'')); refresh();
}
async function applyPreset(name){
  const r=await post('/api/presets',{op:'apply',name});
  toast(r.ok?('已应用，建立 '+r.done+' 条'+(r.failed&&r.failed.length?('，失败 '+r.failed.length):'')):('失败：'+(r.error||''))); refresh();
}
async function delPreset(name){
  if(!confirm('删除预设 '+name+' ?'))return;
  await post('/api/presets',{op:'delete',name}); toast('已删除'); refresh();
}

/* ---------- 监视器 ---------- */
async function monStart(){
  const port=document.getElementById('mon-port').value;
  const r=await post('/api/monitor',{op:'start',port});
  toast(r.ok?('开始监视 '+port):'启动失败');
  MSINCE=0; document.getElementById('mon').innerHTML='';
  clearInterval(MTIMER);
  MTIMER=setInterval(async()=>{
    const d=await api('/api/monitor?port='+encodeURIComponent(port)+'&since='+MSINCE);
    if(!d.msgs||!d.msgs.length)return;
    MSINCE=d.last;
    const mon=document.getElementById('mon');
    d.msgs.forEach(m=>{
      const line=document.createElement('div');
      const t=new Date(m.t*1000).toLocaleTimeString('zh-CN',{hour12:false});
      line.textContent=t+'  '+wrap(m.text);
      mon.appendChild(line);
    });
    while(mon.childElementCount>300) mon.removeChild(mon.firstChild);
    mon.scrollTop=mon.scrollHeight;
  },900);
}
async function monStop(){
  const port=document.getElementById('mon-port').value;
  clearInterval(MTIMER); MTIMER=null;
  await post('/api/monitor',{op:'stop',port}); toast('已停止');
}

/* ---------- 交互 ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  CURTAB=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+CURTAB));
});
document.getElementById('rtp-add').onclick=()=>{const h=document.getElementById('rtp-host').value.trim(); if(h)rtpConnect(h,+document.getElementById('rtp-port').value,'');};
document.getElementById('allink').onclick=async()=>{const s=alsrc.value,d=aldst.value; const r=await post('/api/alsa',{op:'link',src:s,dst:d}); toast(r.ok?'已连接':'失败'); refresh();};
document.getElementById('allink-both').onclick=async()=>{const s=alsrc.value,d=aldst.value; await post('/api/alsa',{op:'link',src:s,dst:d,both:true}); toast('已双向连接'); refresh();};
document.getElementById('alunlink').onclick=async()=>{const s=alsrc.value,d=aldst.value; await post('/api/alsa',{op:'unlink',src:s,dst:d}); toast('已断开'); refresh();};
document.getElementById('alrefresh').onclick=refresh;
document.getElementById('preset-save').onclick=async()=>{
  const name=document.getElementById('preset-name').value.trim(); if(!name)return toast('先起个名字');
  const r=await post('/api/presets',{op:'save',name}); toast(r.ok?'已保存':'失败：'+(r.error||'')); refresh();
};
document.getElementById('mon-start').onclick=monStart;
document.getElementById('mon-stop').onclick=monStop;

refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
