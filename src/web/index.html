<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi-midi 路由管理</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#272c36;--fg:#e6e9ef;--dim:#8b94a3;--acc:#41c9a0;--bad:#e05c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:600}
.tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
main{padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim)}
button{background:#232833;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#08120e;font-weight:600}
select,input{background:#1d222b;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;width:100%}
.form{display:grid;grid-template-columns:1fr 92px auto;gap:8px;margin-top:10px}
.pill{padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.ok{color:var(--acc);border-color:var(--acc)}.bad{color:var(--bad);border-color:var(--bad)}
.links{font-size:11px;color:var(--dim);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);color:var(--dim)}
th{color:#c9d0dc;font-weight:500}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#232833;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>pi-midi 路由管理</h1><span class="tag" id="ver">…</span><span class="tag" id="tick">-</span></header>
<main>
  <div class="card">
    <h2>蓝牙（BLE-MIDI 外设）</h2>
    <div class="row"><span>广播</span><span id="ble-adv" class="pill">…</span></div>
    <div class="row"><span>链路</span><span id="ble-link" class="pill">…</span></div>
    <div class="row"><span>对端地址</span><span id="ble-peer" class="mono">-</span></div>
    <div class="legend">BLE 外设同一时刻只支持 1 条链路；要换设备，先在对方断开。</div>
  </div>

  <div class="card">
    <h2>RTP-MIDI 设备</h2>
    <div id="rtp-list"></div>
    <div class="form">
      <input id="rtp-host" placeholder="主机 IP 或名称，如 192.168.31.142">
      <input id="rtp-port" value="5004">
      <button class="pri" id="rtp-add">连接</button>
    </div>
    <div class="legend">连上后，对方会以 <code>128:x</code> 出现在下面的路由矩阵里，可再指定它接到哪个口。</div>
  </div>

  <div class="card">
    <h2>MIDI 路由（ALSA 连接）</h2>
    <div class="form">
      <select id="alsrc"></select>
      <select id="aldst"></select>
      <button class="pri" id="allink">连接</button>
    </div>
    <div class="form" style="grid-template-columns:1fr 1fr auto">
      <button id="allink-both">双向连接</button>
      <button id="alunlink">断开</button>
      <button id="alrefresh">刷新</button>
    </div>
    <table style="margin-top:12px"><thead><tr><th>端口</th><th>→ 去向</th></tr></thead><tbody id="al-links"></tbody></table>
  </div>
</main>
<div id="toast"></div>
<script>
let TOKEN = localStorage.getItem('pimidi.token') || '';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function api(path,opt){opt=opt||{};if(TOKEN)opt.headers=Object.assign({'X-Token':TOKEN},opt.headers||{});
  const r=await fetch(path,opt);if(r.status===401){TOKEN=prompt('需要访问 token：');localStorage.setItem('pimidi.token',TOKEN||'');return api(path,opt)}
  return r.json()}
function fmtTime(){const d=new Date();return d.toLocaleTimeString('zh-CN',{hour12:false})}
function portLabel(c,p){return c.id+':'+p.id+'  '+p.name.trim()}

async function refresh(){
  let s;
  try{ s=await api('/api/state') }catch(e){ document.getElementById('tick').textContent='连接失败'; return }
  document.getElementById('ver').textContent='v'+s.version;
  document.getElementById('tick').textContent=fmtTime();
  // BLE
  const adv=document.getElementById('ble-adv'), lk=document.getElementById('ble-link');
  adv.textContent=s.ble.advertising?'广播中':'未广播';
  adv.className='pill '+(s.ble.advertising?'ok':'bad');
  lk.textContent=s.ble.connected?'已连接':'等待连接';
  lk.className='pill '+(s.ble.connected?'ok':'');
  document.getElementById('ble-peer').textContent=s.ble.peer||'-';
  // RTP
  const rtp=s.rtp||{};const list=document.getElementById('rtp-list');
  let html='';
  const peers=(rtp.router||[]).filter(p=>p.peer);
  peers.forEach(p=>{
    const lat=(p.peer.latency_ms&&p.peer.latency_ms.last)||0;
    html+='<div class="row"><span>'+p.name+' <span class="mono">#'+p.id+' · '+lat+' ms</span></span>'+
          '<button onclick="rtpRemove('+p.id+')">断开</button></div>';
  });
  if(!peers.length) html+='<div class="row"><span class="mono">暂无已连接的远端设备</span></div>';
  const remotes=(rtp.mdns&&rtp.mdns.remote_announcements)||[];
  const seen=new Set(peers.map(p=>p.name));
  const uniq=[...new Map(remotes.map(r=>[r.name,r])).values()];
  uniq.forEach(r=>{
    if(seen.has(r.name))return;
    html+='<div class="row"><span>'+r.name+' <span class="mono">'+r.hostname+':'+r.port+'</span></span>'+
          '<button onclick="rtpConnect(\''+r.hostname+'\','+r.port+',\''+r.name.replace(/'/g,"\\'")+'\')">连接</button></div>';
  });
  if(!uniq.length&&!peers.length) html+='<div class="row"><span class="mono">网络里没发现 RTP-MIDI 设备</span></div>';
  list.innerHTML=html;
  // ALSA
  const sel1=document.getElementById('alsrc'), sel2=document.getElementById('aldst');
  const prev1=sel1.value, prev2=sel2.value;
  let opts='';
  s.alsa.forEach(c=>c.ports.forEach(p=>{opts+='<option value="'+c.id+':'+p.id+'">'+portLabel(c,p)+'</option>'}));
  sel1.innerHTML=opts; sel2.innerHTML=opts;
  if(prev1)sel1.value=prev1; if(prev2)sel2.value=prev2;
  let rows='';
  s.alsa.forEach(c=>c.ports.forEach(p=>{
    if(p.to.length) rows+='<tr><td>'+portLabel(c,p)+'</td><td>'+p.to.join(', ')+'</td></tr>';
  }));
  document.getElementById('al-links').innerHTML=rows||'<tr><td class="mono">还没有任何路由</td><td></td></tr>';
}
async function rtpConnect(hostname,port,name){
  const r=await api('/api/rtp',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'connect',hostname,port,name})});
  toast(r.ok?'已发起连接':'失败：'+(r.error||''));refresh()}
async function rtpRemove(id){
  const r=await api('/api/rtp',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'remove',id})});
  toast(r.ok?'已移除':'失败：'+(r.error||''));refresh()}
async function alink(both){
  const src=document.getElementById('alsrc').value, dst=document.getElementById('aldst').value;
  if(!src||!dst)return toast('先选两个端口');
  const r=await api('/api/alsa',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'link',src,dst,both})});
  toast(r.ok?'已连接 '+src+' → '+dst:'失败：'+(r.out||''));refresh()}
async function alunlink(){
  const src=document.getElementById('alsrc').value, dst=document.getElementById('aldst').value;
  const r=await api('/api/alsa',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'unlink',src,dst})});
  toast(r.ok?'已断开':'失败：'+(r.out||''));refresh()}
document.getElementById('rtp-add').onclick=()=>rtpConnect(document.getElementById('rtp-host').value.trim(),+document.getElementById('rtp-port').value,'');
document.getElementById('allink').onclick=()=>alink(false);
document.getElementById('allink-both').onclick=()=>alink(true);
document.getElementById('alunlink').onclick=alunlink;
document.getElementById('alrefresh').onclick=refresh;
refresh();setInterval(refresh,2500);
</script>
</body>
</html>
